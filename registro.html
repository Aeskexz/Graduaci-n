<!doctype html>
<html lang="es-SV">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#100e0b">
  <title>Registro · Fiesta de graduación</title>
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/favicon-32.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@700&family=DM+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css">
  <script defer src="./motion.js"></script>
</head>
<body>
  <main class="invitation registration-page" aria-labelledby="titulo">
    <canvas class="particles" aria-hidden="true"></canvas>
    <a class="back-link" href="./index.html">← Volver a la invitación</a>
    <h1 id="titulo">Registro para la graduación</h1>
    <!-- registration-status -->
    <form class="registration-form" method="post" action="./registro.html">
      <label for="guest-name">Nombre completo</label>
      <input id="guest-name" name="nombre" type="text" autocomplete="name" required maxlength="120">
      <button type="submit">Guardar registro</button>
    </form>
  </main>
</body>
</html>
