<!doctype html>
<html lang="es-SV">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f4ec">
  <title>Confirmación de asistencia · Fiesta de graduación</title>
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/favicon-32.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=DM+Sans:wght@400;600&family=Playfair+Display:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="stationery registration-page" aria-labelledby="titulo">
    <a class="back-link" href="./index.html#guia">← Volver a la invitación</a>
    <div class="registration-panel">
      <span class="ornament" aria-hidden="true">❦</span>
      <h1 id="titulo">Confirmación <span>de asistencia</span></h1>
      <!-- registration-status -->
      <form class="registration-form" method="post" action="./registro.html">
        <div class="name-field">
          <label for="guest-name">Nombre completo</label>
          <input id="guest-name" name="nombre" type="text" autocomplete="name" required maxlength="120">
        </div>
        <button type="submit">Confirmar asistencia</button>
      </form>
    </div>
  </main>
</body>
</html>
